<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tintly — Water Sort Puzzle</title>
<style>
  :root { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #7B2FF7 0%, #4A90D9 55%, #30C5B0 100%); color: #fff; text-align: center; }
  main { padding: 32px; }
  h1 { font-size: 56px; margin: 0; font-weight: 900; letter-spacing: 1px; text-shadow: 0 4px 12px rgba(0,0,0,.35); }
  .strap { font-size: 13px; letter-spacing: 3px; font-weight: 800; opacity: .9; margin-bottom: 28px; }
  .tubes { display: flex; justify-content: center; gap: 10px; margin-bottom: 18px; }
  .tube { width: 26px; height: 86px; border: 2.5px solid rgba(255,255,255,.85); border-radius: 3px 3px 13px 13px; background: rgba(255,255,255,.15); overflow: hidden; display: flex; flex-direction: column-reverse; }
  .tube i { display: block; height: 22px; }
  a { color: #fff; font-weight: 700; }
  p { margin: 8px 0; }
</style>
</head>
<body>
<main>
  <div class="tubes">
    <div class="tube"><i style="background:#CE93D8"></i><i style="background:#3EC9FF"></i><i style="background:#FF8A3D"></i></div>
    <div class="tube"><i style="background:#FF6FB5"></i><i style="background:#4A6CF7"></i><i style="background:#7CF25B"></i><i style="background:#FFD23F"></i></div>
    <div class="tube"><i style="background:#3EC9FF;height:66px"></i></div>
  </div>
  <h1>Tintly</h1>
  <div class="strap">WATER SORT PUZZLE</div>
  <p>Sort the colors. Stay calm.</p>
  <p><a href="privacy.html">Privacy Policy</a></p>
</main>
</body>
</html>
